[package]
name = "rust-comp"
version = "0.1.0"
description = "Local diff viewer with GitHub-identical UI"
authors = ["conao"]
edition = "2021"

[[bin]]
name = "comp"
path = "src/main.rs"

[lib]
name = "rust_comp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
